[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solvo-pilot-onramp"
version = "0.1.0"
description = "FDE sidecar for Solvo.ai pre-pilot freight ratesheet normalization"
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn[standard]>=0.32,<0.33",
  "starlette>=0.41,<0.42",
  "python-multipart>=0.0.20",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.6,<3",
  "google-genai>=2.0,<3",
  "google-cloud-aiplatform>=1.70,<2",
  "sqlalchemy[asyncio]>=2.0.49,<2.1",
  "asyncpg>=0.30,<0.31",
  "psycopg2-binary>=2.9.10,<3",
  "alembic>=1.18.4,<1.19",
  "celery[redis]>=5.6.3,<5.7",
  "redis>=5.0,<7",
  "structlog>=24.4,<25",
  "orjson>=3.10,<4",
  "openpyxl>=3.1.5,<3.2",
  "pydifact==0.2.3",
  # Phase 5 additions.
  "slack_sdk>=3.34,<4",
  "google-cloud-storage>=2.18,<3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.25",
  "pytest-cov>=6.0,<7",
  "httpx>=0.28,<0.29",
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2",
  "types-redis",
  "pre-commit>=4.0,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
  "S101",     # assert allowed in tests
  "RUF002",   # en-dash in docstrings is intentional
  "RUF003",   # en-dash in comments is intentional
  "RUF012",   # mutable class attributes in test fakes are intentional
  "E501",     # long error messages preserved for diagnostic clarity
  "S607",     # docker / celery used by partial path in tests
  "B008",     # FastAPI idiom: Depends/File/Form in argument defaults
  "ASYNC240", # local staging-path I/O (Phase 2 only); Phase 5 swaps to GCS
  "S106",     # test fixtures use literal tokens; not real credentials
  "S105",     # test module-level constants used as HMAC secrets in fixtures
]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["pydifact.*", "openpyxl.*", "google.cloud", "google.cloud.*", "google.genai.*", "celery.*", "asyncpg.*"]
ignore_missing_imports = true

# Celery's @task and worker_init.connect decorators are untyped; their wrappers
# are validated by Celery's own runtime, not by mypy.
[[tool.mypy.overrides]]
module = ["packages.ingest.tasks", "apps.worker.boot"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
