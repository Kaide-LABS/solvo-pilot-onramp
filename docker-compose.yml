services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onramp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onramp}
      POSTGRES_DB: ${POSTGRES_DB:-onramp}
    # No host port mapping — internal network only. Phase 6 host-only debug
    # can add `-p 15432:5432` ad hoc; default avoids collisions with a host pg.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onramp} -d ${POSTGRES_DB:-onramp}"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No host port mapping — internal network only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      POSTGRES_DSN_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-onramp}:${POSTGRES_PASSWORD:-onramp}@postgres:5432/${POSTGRES_DB:-onramp}
      POSTGRES_DSN_SYNC: postgresql+psycopg2://${POSTGRES_USER:-onramp}:${POSTGRES_PASSWORD:-onramp}@postgres:5432/${POSTGRES_DB:-onramp}
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-adc/application_default_credentials.json
    volumes:
      - ${USERPROFILE:-${HOME}}/AppData/Roaming/gcloud:/gcp-adc:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      POSTGRES_DSN_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-onramp}:${POSTGRES_PASSWORD:-onramp}@postgres:5432/${POSTGRES_DB:-onramp}
      POSTGRES_DSN_SYNC: postgresql+psycopg2://${POSTGRES_USER:-onramp}:${POSTGRES_PASSWORD:-onramp}@postgres:5432/${POSTGRES_DB:-onramp}
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-adc/application_default_credentials.json
    volumes:
      - ${USERPROFILE:-${HOME}}/AppData/Roaming/gcloud:/gcp-adc:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    env_file: .env
    environment:
      POSTGRES_DSN_ASYNC: postgresql+asyncpg://${POSTGRES_USER:-onramp}:${POSTGRES_PASSWORD:-onramp}@postgres:5432/${POSTGRES_DB:-onramp}
      POSTGRES_DSN_SYNC: postgresql+psycopg2://${POSTGRES_USER:-onramp}:${POSTGRES_PASSWORD:-onramp}@postgres:5432/${POSTGRES_DB:-onramp}
      REDIS_URL: redis://redis:6379/0
      GOOGLE_APPLICATION_CREDENTIALS: /gcp-adc/application_default_credentials.json
    volumes:
      - ${USERPROFILE:-${HOME}}/AppData/Roaming/gcloud:/gcp-adc:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  pgdata:
